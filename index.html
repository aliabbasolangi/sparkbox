<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sparkbox — Party Games</title>
  <link rel="icon" href="images/favicon.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="images/favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=5">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9172610701690985"
    crossorigin="anonymous"></script>
</head>
<body>
  <div class="bg-shapes" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <span class="float-emoji float-1">🎉</span>
    <span class="float-emoji float-2">🎲</span>
    <span class="float-emoji float-3">✨</span>
    <span class="float-emoji float-4">🎭</span>
  </div>

  <div id="app">
    <section id="screen-home" class="screen active">
      <header class="hero">
        <h1 class="wordmark">
          <img src="images/logo.png" alt="sparkbox" class="wordmark-logo" width="240" height="151">
        </h1>
        <p class="tagline">Party games that never lose their spark.</p>
      </header>

      <p class="section-label">Tonight's lineup</p>

      <div class="game-grid">
        <button class="game-card game-card--spy" data-game="spyplay">
          <span class="game-card-icon">🕵️</span>
          <span class="game-card-body">
            <span class="game-name">Incognito</span>
            <span class="game-desc">Who's the spy? Ask questions, find the imposter.</span>
          </span>
          <span class="game-card-go" aria-hidden="true">→</span>
        </button>
        <button class="game-card game-card--mafia" data-game="mafia">
          <span class="game-card-icon">🌙</span>
          <span class="game-card-body">
            <span class="game-name">Mafia</span>
            <span class="game-desc">Lie, bluff, and survive the night.</span>
          </span>
          <span class="game-card-go" aria-hidden="true">→</span>
        </button>
        <button class="game-card game-card--impostor" data-game="impostor">
          <span class="game-card-icon">🎭</span>
          <span class="game-card-body">
            <span class="game-name">Impostor</span>
            <span class="game-desc">One word each turn — spot who doesn't know.</span>
          </span>
          <span class="game-card-go" aria-hidden="true">→</span>
        </button>
        <button class="game-card game-card--callit" data-game="callit">
          <span class="game-card-icon">⚡</span>
          <span class="game-card-body">
            <span class="game-name">Call It</span>
            <span class="game-desc">Bid, call it, and name them under the clock.</span>
          </span>
          <span class="game-card-go" aria-hidden="true">→</span>
        </button>
        <button class="game-card game-card--wavelength" data-game="wavelength">
          <span class="game-card-icon">📡</span>
          <span class="game-card-body">
            <span class="game-name">Read the Room</span>
            <span class="game-desc">One sits out. The rest share a number. Guess it from three answers.</span>
          </span>
          <span class="game-card-go" aria-hidden="true">→</span>
        </button>
        <button class="game-card game-card--install" data-game="install">
          <span class="game-card-icon">📲</span>
          <span class="game-card-body">
            <span class="game-name">Add to home screen</span>
            <span class="game-desc">Save Sparkbox on your device. iOS app coming soon.</span>
          </span>
          <span class="game-card-go" aria-hidden="true">→</span>
        </button>
      </div>

      <footer class="home-footer">
        <p>No accounts · No setup · Just pass the device</p>
      </footer>
    </section>

    <section id="screen-game" class="screen"></section>
  </div>

  <div id="modal-root" class="modal-root" hidden></div>

  <script type="module" src="js/app.js?v=5"></script>
</body>
</html>
